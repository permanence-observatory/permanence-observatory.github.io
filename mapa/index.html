<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Permanence · Experimental map</title>
<meta name="description" content="News about informal settlements, collected daily from GDELT and classified by an open language model.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
/* Layout: a scrolling reading panel beside a dark map; removals are the one warm color on the page */
:root {
  color-scheme: dark;
  --bg: #0e1315; --panel: #141b1e; --raise: #1b2428; --ink: #e6ecea; --muted: #94a3a0; --line: #26312f;
  --removal: #ff7452; --removal-soft: rgba(255,116,82,.16); --point: #7fd1d9; --point-soft: rgba(127,209,217,.14);
  --display: "Newsreader", Georgia, "Times New Roman", serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box }
html, body { height: 100%; margin: 0 }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); display: grid; grid-template-columns: 420px minmax(0, 1fr) }
aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-height: 0;
  padding-top: env(safe-area-inset-top, 0px); padding-left: env(safe-area-inset-left, 0px) }
#map { height: 100%; background: var(--bg) }
.head { padding: 18px 20px 12px; display: grid; gap: 8px }
.top { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.eyebrow { font: 500 .72rem var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase }
h1 { font: 600 1.6rem/1.1 var(--display); margin: 0; text-wrap: balance }
.lede { margin: 0; color: var(--muted); font-size: .85rem }
.stats { display: flex; gap: 18px; font: .75rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.stats b { display: block; font: 600 1.2rem var(--body); color: var(--ink) }
.stats .rem b { color: var(--removal) }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.lang button { background: none; border: 0; color: var(--muted); font: 500 .72rem var(--mono); padding: 3px 8px; cursor: pointer; letter-spacing: .04em }
.lang button[aria-pressed="true"] { background: var(--point-soft); color: var(--ink) }
details.filters { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line) }
details.filters > summary { list-style: none; cursor: pointer; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
  font: 500 .72rem var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase }
details.filters > summary::-webkit-details-marker { display: none }
details.filters > summary::after { content: "▾"; font-size: .9rem; transition: transform .2s }
details.filters:not([open]) > summary::after { transform: rotate(-90deg) }
#active { color: var(--point); text-transform: none; letter-spacing: 0 }
.fbody { padding: 0 20px 14px; display: grid; gap: 12px }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.label { font: 500 .7rem var(--mono); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; width: 100% }
button, select, input { font: inherit; color: var(--ink) }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--point); outline-offset: 2px }
.switch { display: inline-flex; align-items: center; gap: 10px; background: var(--removal-soft); border: 1px solid transparent;
  border-radius: 999px; padding: 5px 14px 5px 7px; cursor: pointer; color: var(--ink); font-weight: 600 }
.switch i { width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; transition: background .2s }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: left .2s }
.switch[aria-pressed="true"] { border-color: var(--removal) }
.switch[aria-pressed="true"] i { background: var(--removal) }
.switch[aria-pressed="true"] i::after { left: 14px }
select, input[type=search] { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px }
input[type=search] { width: 100% }
.chip { background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: .78rem; color: var(--muted) }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--point); background: var(--point-soft) }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { background: var(--raise); border: 0; padding: 4px 11px; cursor: pointer; color: var(--muted); font-size: .8rem }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--point-soft) }
.listhead { position: sticky; top: 0; z-index: 2; background: var(--panel); padding: 10px 20px 8px; font: .74rem var(--mono); color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line) }
ol.list { list-style: none; margin: 0; padding: 4px 12px 8px }
.item { padding: 10px 8px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 4px; border-radius: 6px }
.item:hover, .item:focus-visible { background: var(--raise) }
.item .when { font: .72rem var(--mono); color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap }
.item h2 { font: 500 1rem/1.3 var(--display); margin: 0; overflow-wrap: anywhere }
.item[data-removal] h2::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--removal); margin-right: 6px; vertical-align: middle }
.tags { display: flex; flex-wrap: wrap; gap: 4px }
.tag { font-size: .7rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px }
.tag.rem { color: var(--removal); border-color: var(--removal) }
.empty { color: var(--muted); padding: 24px 8px; text-align: center }
.foot { padding: 14px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font-size: .74rem; color: var(--muted); display: grid; gap: 4px }
.foot a { color: var(--point) }

/* Leaflet skin */
.leaflet-container { font: 13px/1.45 var(--body); background: var(--bg) }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.45) }
.leaflet-popup-content { margin: 14px 16px; min-width: 240px; max-width: 320px }
.leaflet-container a.leaflet-popup-close-button { color: var(--muted) }
.pop { display: grid; gap: 6px }
.pop .when { font: .72rem var(--mono); color: var(--muted) }
.pop h3 { font: 500 1.05rem/1.3 var(--display); margin: 0 }
.pop h3 a { color: var(--ink); text-decoration-color: var(--line) }
.pop p { margin: 0; color: var(--muted); font-size: .82rem }
.pop p small { font: .68rem var(--mono); letter-spacing: .04em; text-transform: uppercase; display: block }
.pop .src { font: .72rem var(--mono); color: var(--muted) }
.leaflet-control-zoom a { background: var(--panel); color: var(--ink); border-color: var(--line) }
.leaflet-control-attribution { background: rgba(14,19,21,.75) !important; color: var(--muted) }
.leaflet-control-attribution a { color: var(--muted) }
.cl { display: grid; place-items: center; border-radius: 50%; font: 600 12px var(--body); color: var(--bg); background: var(--point); box-shadow: 0 0 0 5px var(--point-soft) }
.cl.has-rem { box-shadow: 0 0 0 3px var(--removal), 0 0 0 8px var(--removal-soft) }
.mode { margin: 0 !important; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: inline-flex; overflow: hidden }
.mode button { background: none; border: 0; color: var(--muted); padding: 6px 12px; cursor: pointer; font-size: .8rem }
.mode button + button { border-left: 1px solid var(--line) }
.mode button[aria-pressed="true"] { color: var(--ink); background: var(--point-soft) }
.heatnote { margin: 0 0 6px 6px !important; background: rgba(20,27,30,.92); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  max-width: 290px; font-size: .75rem; color: var(--muted); display: grid; gap: 6px }
.heatnote b { color: var(--ink); font-weight: 600 }
.heatnote .ramp { height: 8px; border-radius: 4px }
.heatnote .ends { display: flex; justify-content: space-between; font: .68rem var(--mono) }
.trends { color: var(--point); font-size: .82rem; text-decoration: none; justify-self: start }
.trends:hover { text-decoration: underline }

@media (max-width: 760px) {
  body { grid-template-columns: minmax(0, 1fr); grid-template-rows: 46vh minmax(0, 1fr) }
  #map { grid-row: 1 }
  aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding-top: 0 }
  .heatnote { max-width: 210px; padding: 7px 9px; gap: 4px; font-size: .66rem; line-height: 1.35 }
}
@media (prefers-reduced-motion: reduce) { .switch i, .switch i::after, details.filters > summary::after { transition: none } }
</style>
</head>
<body>
<aside>
  <div class="head">
    <div class="top">
      <span class="eyebrow" data-i18n="eyebrow"></span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </div>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <div class="stats" aria-live="polite">
      <span><b id="n-stories">–</b><span data-i18n="stories"></span></span>
      <span class="rem"><b id="n-removals">–</b><span data-i18n="removals"></span></span>
      <span><b id="n-days">–</b><span data-i18n="days"></span></span>
    </div>
    <a class="trends" href="painel.html" data-i18n="trends"></a>
  </div>
  <details class="filters" id="filters" open>
    <summary><span data-i18n="filters"></span><span id="active"></span></summary>
    <div class="fbody">
      <div class="row">
        <button type="button" class="switch" id="only-removals" aria-pressed="false"><i aria-hidden="true"></i><span data-i18n="onlyRemovals"></span></button>
        <select id="stage" hidden>
          <option value="" data-i18n="allStages"></option>
          <option value="executed" data-i18n="st_executed"></option>
          <option value="threat" data-i18n="st_threat"></option>
          <option value="court" data-i18n="st_court"></option>
          <option value="resettlement" data-i18n="st_resettlement"></option>
        </select>
      </div>
      <div class="row">
        <span class="label" data-i18n="region"></span>
        <div class="seg" id="region" role="group">
          <button type="button" data-region="" aria-pressed="true" data-i18n="all"></button>
          <button type="button" data-region="south" aria-pressed="false" data-i18n="south"></button>
          <button type="button" data-region="north" aria-pressed="false" data-i18n="north"></button>
        </div>
      </div>
      <div class="row" id="topics" role="group"><span class="label" data-i18n="topics"></span></div>
      <div class="row">
        <span class="label" data-i18n="period"></span>
        <div class="seg" id="period" role="group">
          <button type="button" data-days="7" aria-pressed="false" data-i18n="d7"></button>
          <button type="button" data-days="30" aria-pressed="false" data-i18n="d30"></button>
          <button type="button" data-days="0" aria-pressed="true" data-i18n="all"></button>
        </div>
      </div>
      <input type="search" id="q">
    </div>
  </details>
  <div class="listhead"><span id="list-count"></span><span data-i18n="newest"></span></div>
  <ol class="list" id="list"></ol>
  <div class="foot">
    <span id="updated">—</span>
    <span data-i18n="method"></span>
    <span data-i18n="regionNote"></span>
    <span><a href="../" data-i18n="mainMap"></a></span>
  </div>
</aside>
<div id="map" role="region"></div>

<script>
const I18N = {
  en: {
    eyebrow: 'Permanence · experimental', title: 'Informal settlements in the news',
    lede: 'News about favelas, slums and informal settlements, collected daily from GDELT and classified by an open language model. Locations are approximate.',
    stories: 'stories', removals: 'evictions', days: 'days', filters: 'Filters', onlyRemovals: 'Evictions only',
    allStages: 'All stages', st_executed: 'Carried out', st_threat: 'Threat or announcement', st_court: 'Court decision',
    st_resettlement: 'Resettlement', st_unspecified: 'Stage not identified',
    region: 'Region', all: 'All', south: 'Global South', north: 'Global North', topics: 'Topics', period: 'Period',
    d7: '7 days', d30: '30 days', search: 'Search by place, title or source', newest: 'newest first',
    inView: (a, b) => `${a} of ${b} in view`, noneHere: 'No stories in this area. Zoom out to see more.',
    noneAtAll: 'No stories match these filters.', loading: 'Loading…', loadError: 'Could not load the map data.',
    updated: (d, days) => `Updated ${d} · days collected: ${days}`,
    method: 'Automatic classification (qwen2.5:7b), checked by sampling. Places geocoded with GeoNames (CC BY 4.0) or taken from GDELT. Hollow points: location known only at country or region level.',
    regionNote: 'Evictions: forced evictions of informal settlement residents, including demolitions, threats and notices, court decisions and resettlement. Global North: Europe, Northern America, Japan, Australia and New Zealand (UN M49 developed regions).',
    mainMap: 'Main map', versions: n => `${n} versions`, note: 'Model note (Portuguese)', active: n => `${n} active`,
    prec: { assentamento: 'settlement', cidade: 'city', 'região': 'region only', 'país': 'country only' },
    removal: 'Eviction', map: 'Map', lang: 'Language',
    trends: 'Daily trends dashboard →', points: 'Points', density: 'Density', mapMode: 'Map display',
    heatTitle: 'Density of stories',
    heatNote: (n, x) => `${n} stories with a city- or settlement-level place. ${x} known only at country or region level are left out. Density shows press coverage, not how often events happen.`,
    low: 'fewer', high: 'more',
    t: { removal: 'Eviction', disaster: 'Disaster', violence: 'Violence', housing_policy: 'Housing policy', infrastructure: 'Infrastructure',
      land_conflict: 'Land conflict', protest: 'Protest & organizing', culture: 'Culture & people', economy: 'Economy',
      health_education: 'Health & education', data: 'Studies & data', other: 'Other' }
  },
  pt: {
    eyebrow: 'Permanence · experimental', title: 'Favelas no noticiário',
    lede: 'Notícias sobre favelas e assentamentos informais, coletadas todo dia do GDELT e classificadas por um modelo de linguagem aberto. Os locais são aproximados.',
    stories: 'assuntos', removals: 'remoções', days: 'dias', filters: 'Filtros', onlyRemovals: 'Só remoções',
    allStages: 'Todas as etapas', st_executed: 'Executada', st_threat: 'Ameaça ou anúncio', st_court: 'Decisão judicial',
    st_resettlement: 'Reassentamento', st_unspecified: 'Etapa não identificada',
    region: 'Região', all: 'Tudo', south: 'Sul global', north: 'Norte global', topics: 'Temas', period: 'Período',
    d7: '7 dias', d30: '30 dias', search: 'Buscar por lugar, título ou fonte', newest: 'mais recentes primeiro',
    inView: (a, b) => `${a} de ${b} na área visível`, noneHere: 'Nenhum assunto nesta área. Afaste o mapa para ver mais.',
    noneAtAll: 'Nenhum assunto com esses filtros.', loading: 'Carregando…', loadError: 'Não foi possível carregar os dados do mapa.',
    updated: (d, days) => `Atualizado em ${d} · dias coletados: ${days}`,
    method: 'Classificação automática (qwen2.5:7b), conferida por amostragem. Locais geocodificados com o GeoNames (CC BY 4.0) ou tirados do GDELT. Pontos vazados: local só no nível de país ou região.',
    regionNote: 'Remoções: remoções forçadas de moradores de assentamentos informais, incluindo demolições, ameaças e avisos, decisões judiciais e reassentamento. Norte global: Europa, América do Norte, Japão, Austrália e Nova Zelândia (regiões desenvolvidas da ONU, M49).',
    mainMap: 'Mapa atual', versions: n => `${n} versões`, note: 'Resumo do modelo', active: n => n === 1 ? '1 ativo' : `${n} ativos`,
    prec: { assentamento: 'local do assentamento', cidade: 'cidade', 'região': 'só a região', 'país': 'só o país' },
    removal: 'Remoção', map: 'Mapa', lang: 'Idioma',
    trends: 'Painel de tendências diárias →', points: 'Pontos', density: 'Densidade', mapMode: 'Exibição do mapa',
    heatTitle: 'Densidade de assuntos',
    heatNote: (n, x) => `${n} assuntos com local no nível de cidade ou assentamento. Ficam de fora ${x} com local só no nível de país ou região. A densidade mostra a cobertura da imprensa, não a frequência dos acontecimentos.`,
    low: 'menos', high: 'mais',
    t: { removal: 'Remoção', disaster: 'Desastre', violence: 'Violência', housing_policy: 'Política habitacional', infrastructure: 'Infraestrutura',
      land_conflict: 'Conflito fundiário', protest: 'Protesto e organização', culture: 'Cultura e pessoas', economy: 'Economia',
      health_education: 'Saúde e educação', data: 'Estudos e dados', other: 'Outro' }
  }
};
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function savedLang() { try { return localStorage.getItem('permanence-lang'); } catch (e) { return null; } }
const state = { lang: savedLang() === 'pt' ? 'pt' : 'en', events: [], days: [], generated: null, onlyRemovals: false, stage: '',
  region: '', topics: new Set(), period: 0, q: '', latest: null, mode: 'points' };
const T = () => I18N[state.lang];

const map = L.map('map', { worldCopyJump: true }).setView([5, 10], 2);
// Esri World Dark Gray (free, no API key); same basemap decision as the main map
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 16, attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ' }).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
  { maxZoom: 16 }).addTo(map);

const clusters = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 44, spiderfyOnMaxZoom: true,
  iconCreateFunction(c) {
    const kids = c.getAllChildMarkers(), n = kids.length, rem = kids.some(m => m.options.removal);
    const size = n < 10 ? 28 : n < 50 ? 34 : 40;
    return L.divIcon({ html: `<div class="cl${rem ? ' has-rem' : ''}" style="width:${size}px;height:${size}px">${n}</div>`,
      className: '', iconSize: [size, size] });
  }
}).addTo(map);
const markers = new Map();

// Density view: one hue, dim to bright on the dark basemap; evictions-only switches to the eviction hue.
// Places known only at country or region level are left out: they would pile up on centroids.
const HEAT = {
  point: { 0.2: '#12474d', 0.45: '#2b8790', 0.7: '#7fd1d9', 1: '#e3fbfd' },
  removal: { 0.2: '#5a2316', 0.45: '#b4472c', 0.7: '#ff7452', 1: '#ffe0d6' }
};
// maxZoom sets how fast intensity fades when zoomed out; 5 keeps the busiest cities bright at world view without saturating the rest
const heat = L.heatLayer([], { radius: 18, blur: 16, maxZoom: 5, max: 1, minOpacity: 0.25, gradient: HEAT.point });
const precise = e => e.precision !== 'país' && e.precision !== 'região';

const ModeControl = L.Control.extend({
  options: { position: 'topright' },
  onAdd() {
    const box = L.DomUtil.create('div', 'mode leaflet-control');
    box.setAttribute('role', 'group');
    ['points', 'density'].forEach(m => {
      const b = L.DomUtil.create('button', '', box); b.type = 'button'; b.dataset.mode = m;
      b.addEventListener('click', () => setMode(m));
    });
    L.DomEvent.disableClickPropagation(box);
    return box;
  }
});
const NoteControl = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd() { const d = L.DomUtil.create('div', 'heatnote leaflet-control'); d.hidden = true; return d; }
});
const modeCtl = new ModeControl().addTo(map);
const noteCtl = new NoteControl().addTo(map);

function setMode(m) {
  state.mode = m;
  if (m === 'density') { map.removeLayer(clusters); heat.addTo(map); map.closePopup(); }
  else { map.removeLayer(heat); clusters.addTo(map); }
  modeLabels();
  render();
}
function modeLabels() {
  const box = modeCtl.getContainer();
  box.setAttribute('aria-label', T().mapMode);
  box.querySelectorAll('button').forEach(b => { b.textContent = T()[b.dataset.mode]; b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)); });
}
function renderHeat(shown) {
  const pts = shown.filter(precise);
  const ramp = state.onlyRemovals ? HEAT.removal : HEAT.point;
  heat.setOptions({ gradient: ramp });
  heat.setLatLngs(pts.map(e => [e.lat, e.lon, 0.6]));
  const note = noteCtl.getContainer();
  note.hidden = state.mode !== 'density';
  if (note.hidden) return;
  const stops = Object.entries(ramp).sort((x, y) => x[0] - y[0]).map(([k, c]) => `${c} ${k * 100}%`).join(', ');
  note.replaceChildren();
  const b = document.createElement('b'); b.textContent = T().heatTitle;
  const bar = document.createElement('div'); bar.className = 'ramp'; bar.style.background = `linear-gradient(90deg, ${stops})`;
  const ends = document.createElement('div'); ends.className = 'ends';
  const lo = document.createElement('span'); lo.textContent = T().low; const hi = document.createElement('span'); hi.textContent = T().high;
  ends.append(lo, hi);
  const p = document.createElement('span'); p.textContent = T().heatNote(pts.length, shown.length - pts.length);
  note.append(b, bar, ends, p);
}

function fmtDate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString(state.lang === 'pt' ? 'pt-BR' : 'en-GB',
    { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
}
function stageLabel(s) { return T()['st_' + s] || s; }

function tags(e) {
  const t = document.createElement('div'); t.className = 'tags';
  if (e.removal) { const x = document.createElement('span'); x.className = 'tag rem'; x.textContent = `${T().removal} · ${stageLabel(e.removal)}`; t.append(x); }
  e.topics.filter(k => k !== 'removal').forEach(k => { const x = document.createElement('span'); x.className = 'tag'; x.textContent = T().t[k] || k; t.append(x); });
  return t;
}

function popup(e) {
  const box = document.createElement('div'); box.className = 'pop';
  const when = document.createElement('span'); when.className = 'when';
  when.textContent = `${fmtDate(e.date)} · ${e.place} (${T().prec[e.precision] || e.precision})`;
  const h = document.createElement('h3'); const a = document.createElement('a');
  a.href = e.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = e.title; h.append(a);
  box.append(when, h);
  if (e.reason) {
    const p = document.createElement('p'); const s = document.createElement('small'); s.textContent = T().note;
    p.append(s, document.createTextNode(e.reason)); box.append(p);
  }
  box.append(tags(e));
  const src = document.createElement('span'); src.className = 'src';
  src.textContent = e.source + (e.versions > 1 ? ` · ${T().versions(e.versions)}` : '');
  box.append(src);
  return box;
}

function markerFor(e) {
  const vague = e.precision === 'país' || e.precision === 'região';
  const color = e.removal ? css('--removal') : css('--point');
  const m = L.circleMarker([e.lat, e.lon], {
    radius: e.removal ? 9 : 6, color, weight: vague ? 2 : 1.5, fillColor: color,
    fillOpacity: vague ? 0 : (e.removal ? .9 : .7), removal: !!e.removal
  });
  m.bindPopup(() => popup(e), { maxWidth: 340 });
  return m;
}

function visible() {
  const q = state.q.trim().toLowerCase();
  const cutoff = state.period && state.latest ? new Date(state.latest.getTime() - (state.period - 1) * 864e5) : null;
  return state.events.filter(e => {
    if (state.onlyRemovals && !e.removal) return false;
    if (state.onlyRemovals && state.stage && e.removal !== state.stage) return false;
    if (state.region && e.region !== state.region) return false;
    if (state.topics.size && !e.topics.some(t => state.topics.has(t))) return false;
    if (cutoff && new Date(e.date) < cutoff) return false;
    if (q && !(`${e.title} ${e.place} ${e.source} ${e.reason}`.toLowerCase().includes(q))) return false;
    return true;
  });
}

function activeCount() {
  return (state.onlyRemovals ? 1 : 0) + (state.region ? 1 : 0) + state.topics.size + (state.period ? 1 : 0) + (state.q.trim() ? 1 : 0);
}

function render() {
  const shown = visible();
  clusters.clearLayers();
  if (state.mode === 'points') clusters.addLayers(shown.map(e => markers.get(e.id)));
  renderHeat(shown);
  const n = activeCount();
  $('active').textContent = n ? T().active(n) : '';
  if (!state.events.length) return;
  const b = map.getBounds();
  const inView = shown.filter(e => b.contains([e.lat, e.lon]) || b.contains([e.lat, e.lon + 360]) || b.contains([e.lat, e.lon - 360]));
  $('list-count').textContent = T().inView(inView.length, shown.length);
  const list = $('list');
  list.replaceChildren(...inView.slice(0, 300).map(e => {
    const li = document.createElement('li'); li.className = 'item'; li.tabIndex = 0;
    if (e.removal) li.dataset.removal = '';
    const when = document.createElement('div'); when.className = 'when';
    const d = document.createElement('span'); d.textContent = fmtDate(e.date);
    const p = document.createElement('span'); p.textContent = e.place;
    when.append(d, p);
    const h = document.createElement('h2'); h.textContent = e.title;
    li.append(when, h, tags(e));
    const go = () => {
      if (state.mode !== 'points') setMode('points');
      const m = markers.get(e.id); clusters.zoomToShowLayer(m, () => m.openPopup());
    };
    li.addEventListener('click', go);
    li.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); go(); } });
    return li;
  }));
  if (!inView.length) {
    const li = document.createElement('li'); li.className = 'empty';
    li.textContent = shown.length ? T().noneHere : T().noneAtAll;
    list.append(li);
  }
}

function buildTopicChips() {
  const counts = {};
  state.events.forEach(e => e.topics.forEach(t => { if (t !== 'removal') counts[t] = (counts[t] || 0) + 1; }));
  const box = $('topics');
  box.querySelectorAll('.chip').forEach(c => c.remove());
  Object.keys(I18N.en.t).filter(t => counts[t]).forEach(t => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.textContent = `${T().t[t]} ${counts[t]}`; b.setAttribute('aria-pressed', String(state.topics.has(t)));
    b.addEventListener('click', () => {
      state.topics.has(t) ? state.topics.delete(t) : state.topics.add(t);
      b.setAttribute('aria-pressed', String(state.topics.has(t))); render();
    });
    box.append(b);
  });
}

function regionCounts() {
  const c = { '': state.events.length, south: 0, north: 0 };
  state.events.forEach(e => { c[e.region] = (c[e.region] || 0) + 1; });
  document.querySelectorAll('#region button').forEach(b => {
    const key = b.dataset.region;
    b.textContent = `${T()[key || 'all']} ${state.events.length ? c[key] : ''}`.trim();
  });
}

function applyLang() {
  const t = T();
  document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';
  document.title = state.lang === 'pt' ? 'Permanence · Mapa experimental' : 'Permanence · Experimental map';
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.textContent = v; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
  $('q').placeholder = t.search; $('q').setAttribute('aria-label', t.search);
  $('stage').setAttribute('aria-label', t.allStages);
  $('map').setAttribute('aria-label', t.map);
  document.querySelector('.lang').setAttribute('aria-label', t.lang);
  if (!state.events.length) $('list-count').textContent = t.loading;
  if (state.generated) $('updated').textContent = t.updated(fmtDate(state.generated), state.days.map(fmtDate).join(', '));
  buildTopicChips(); regionCounts(); modeLabels();
  map.closePopup();
  render();
}

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  state.lang = b.dataset.lang;
  try { localStorage.setItem('permanence-lang', state.lang); } catch (e) { /* storage unavailable */ }
  applyLang();
}));
$('only-removals').addEventListener('click', ev => {
  state.onlyRemovals = !state.onlyRemovals;
  ev.currentTarget.setAttribute('aria-pressed', String(state.onlyRemovals));
  $('stage').hidden = !state.onlyRemovals; render();
});
$('stage').addEventListener('change', ev => { state.stage = ev.target.value; render(); });
document.querySelectorAll('#region button').forEach(b => b.addEventListener('click', () => {
  state.region = b.dataset.region;
  document.querySelectorAll('#region button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.querySelectorAll('#period button').forEach(b => b.addEventListener('click', () => {
  state.period = Number(b.dataset.days);
  document.querySelectorAll('#period button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
let qTimer;
$('q').addEventListener('input', ev => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = ev.target.value; render(); }, 200); });
map.on('moveend', () => render());
// On short screens start with the filters folded, so the story list is visible
if (window.innerHeight < 760) $('filters').open = false;

applyLang();
fetch('events.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  state.events = data.events;
  state.days = data.days;
  state.generated = data.generated_at.slice(0, 10);
  state.events.forEach(e => markers.set(e.id, markerFor(e)));
  state.latest = data.days.length ? new Date(data.days[data.days.length - 1]) : null;
  $('n-stories').textContent = data.events.length;
  $('n-removals').textContent = data.events.filter(e => e.removal).length;
  $('n-days').textContent = data.days.length;
  applyLang();
}).catch(() => { $('list-count').textContent = T().loadError; });
</script>
</body>
</html>
