name: Update Slum News Map Daily

on:
  schedule:
    # Run every day at 00:00 UTC (adjust time as needed)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Never run two map updates at the same time; a new run waits for the current one
concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update-map:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push changes
      issues: write    # To open an issue when the run fails

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas
    
    - name: Run GDELT mapper
      run: python gdelt_version_v21.py
    
    - name: Move HTML to root (for GitHub Pages)
      run: |
        if [ -f "slum_news_map.html" ]; then
          cp slum_news_map.html index.html
          echo "✅ Map copied to index.html"
        else
          echo "❌ ERROR: No map file generated!"
          exit 1
        fi
    
    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Add only the index.html file
        git add index.html
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "ℹ️  No changes to commit (map unchanged)"
        else
          git commit -m "🗺️ Daily map update - $(date +%Y-%m-%d)"
          # main may have received commits while the script was running
          git pull --rebase origin main
          git push
          echo "✅ Map published successfully!"
        fi

    - name: Open an issue if the run failed
      if: failure()
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        gh issue create --repo "$GITHUB_REPOSITORY" \
          --title "Atualização do mapa principal falhou ($(date -u +%Y-%m-%d))" \
          --body "A rodada diária do mapa principal (index.html) falhou; o site continua com o mapa do dia anterior.

        Rodada: $RUN_URL

        Para rodar de novo: aba Actions > Update Slum News Map Daily > Run workflow. Feche esta issue quando o mapa voltar a atualizar."
