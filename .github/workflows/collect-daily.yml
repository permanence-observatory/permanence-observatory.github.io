# Daily GKG collection with language-model classification, saved as history in data/gkg/,
# plus the data of the experimental map (mapa/events.json).
# Runs alongside the main map update and does not change index.html.
# Runs on main by schedule, or by hand (workflow_dispatch) for a chosen day.
name: Daily GKG collection

on:
  schedule:
    - cron: '0 6 * * *'  # after the map update (00:00 UTC, ~1 h) has pushed
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC day to collect (YYYY-MM-DD); empty = yesterday'
        required: false

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write  # to open an issue when the run fails
    env:
      MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests pandas

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/api/version; then
            nohup ollama serve > ollama.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done

      - name: Download model
        run: ollama pull "$MODEL"

      - name: Collect and classify
        run: |
          DAY="${{ github.event.inputs.date }}"
          [ -z "$DAY" ] && DAY=$(date -u -d yesterday +%Y-%m-%d)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          python pipeline/collect_day.py --date "$DAY" --model "$MODEL"
          # Compare the day with the previous 14 (writes AAAA-MM-DD.watch.json)
          python pipeline/watch_day.py --date "$DAY"

      - name: Restore the GeoNames files
        uses: actions/cache@v4
        with:
          path: .cache/geonames
          # One shared copy; country files fetched during a run are added on the next save
          key: geonames-v1-${{ github.run_id }}
          restore-keys: geonames-v1-

      - name: Commit history file, rebuild map data and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/gkg
          if git diff --staged --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "📥 Daily GKG collection - $DAY"
          # The job checked out the branch as it was when the run was queued; other runs
          # may have pushed since. Day files never collide, but the map data file does,
          # so it is rebuilt from the full history only after catching up.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          python pipeline/build_map_data.py
          git add mapa/events.json mapa/stats.json
          git commit --amend --no-edit
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Open an issue if the daily watch found a data problem
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WATCH="data/gkg/${DAY:0:4}/${DAY:5:2}/${DAY}.watch.json"
          [ -f "$WATCH" ] || exit 0
          STATUS=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['status'])" "$WATCH")
          [ "$STATUS" = "data_problem" ] || exit 0
          REASONS=$(python -c "import json,sys; print(chr(10).join('- ' + r for r in json.load(open(sys.argv[1]))['reasons']))" "$WATCH")
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "Vigia diário: possível problema de dados em $DAY"             --body "O vigia diário (pipeline/watch_day.py) marcou o dia $DAY como possível problema de dados: o mapa experimental pode estar errado para esse dia.

          Motivos:
          $REASONS

          Detalhes em $WATCH. Feche esta issue depois de verificar ou corrigir o dia."

      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Coletor diário falhou (${DAY:-data desconhecida})" \
            --body "A rodada do coletor diário falhou e o dia ${DAY:-?} pode estar faltando no histórico (data/gkg) e no mapa experimental.

          Rodada: $RUN_URL

          Para recoletar o dia: aba Actions > Daily GKG collection > Run workflow, com a data. Feche esta issue quando o dia estiver no histórico."
