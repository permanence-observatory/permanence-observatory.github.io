# Temporary experiment: measure local open models as news classifiers
# against the hand-labeled reference set. Runs only on the prototype branch.
name: LLM classifier test

on:
  push:
    branches: [gkg-prototype]
    paths:
      - '.github/workflows/llm-classifier-test.yml'
      - 'prototype/classify_llm.py'
      - 'prototype/data/**'

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen2.5:7b']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests pandas  # pandas: imported by the settlement list module

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://localhost:11434/api/version; then
            nohup ollama serve > ollama.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done

      - name: Download model
        run: ollama pull "${{ matrix.model }}"

      - name: Classify reference set
        shell: bash  # adds pipefail, so a script error is not hidden by tee
        run: |
          mkdir -p results
          SAFE=$(echo "${{ matrix.model }}" | tr ':/' '--')
          python prototype/classify_llm.py prototype/data/reference_2026-11-05_proxy.csv \
            --model "${{ matrix.model }}" \
            --out "results/pred_${SAFE}.csv" 2>&1 | tee "results/log_${SAFE}.txt"
          nproc > "results/machine_${SAFE}.txt"; free -g >> "results/machine_${SAFE}.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ strategy.job-index }}
          path: results/
